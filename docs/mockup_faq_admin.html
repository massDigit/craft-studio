<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquette - Administration FAQ Taxon</title>
    <!-- Mimic Sylius 2.x Bootstrap Admin style -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; color: #212529; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .sylius-header { background: #fff; padding: 1.5rem 2rem; border-bottom: 1px solid #dee2e6; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .sylius-container { max-width: 1100px; margin: 0 auto; padding: 0 1rem; }
        
        /* Styliser les cartes Sylius */
        .card { border: 1px solid #dee2e6; border-radius: 0.375rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 1.5rem; background-color: #fff; }
        .card-header { background-color: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 1rem 1.25rem; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin: 0; color: #495057; }
        .card-body { padding: 1.25rem; }
        
        .form-label { font-weight: 500; font-size: 0.9rem; color: #495057; }

        /* Le sous-bloc FAQ (Collection item) */
        .faq-item-block { 
            border: 1px solid #e9ecef; 
            border-radius: 0.375rem; 
            padding: 1.25rem; 
            margin-bottom: 1rem; 
            background: #fff; 
            position: relative; 
            border-left: 4px solid #D4AF37;
        }
        .faq-item-block .remove-btn { 
            position: absolute; 
            top: 1.25rem; 
            right: 1.25rem; 
        }

        /* Bouton IA */
        .btn-ai-generate {
            background: linear-gradient(135deg, #6f42c1, #8A2BE2);
            color: white;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: 0.25rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-ai-generate:hover {
            background: linear-gradient(135deg, #59339d, #6b21b0);
            color: white;
            transform: translateY(-1px);
        }

        /* Loader animation pour l'IA */
        .ai-loading {
            display: none;
            font-size: 0.85rem;
            color: #6f42c1;
            font-weight: 500;
        }
        .ai-loading.active {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="sylius-header">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small text-muted">
                    <li class="breadcrumb-item">Catalogue</li>
                    <li class="breadcrumb-item">Taxons</li>
                </ol>
            </nav>
            <h1 class="m-0 fs-4 fw-bold">Modifier "Instruments à vent"</h1>
        </div>
        <div>
            <button class="btn btn-secondary me-2">Annuler</button>
            <button class="btn btn-primary">Enregistrer</button>
        </div>
    </div>

    <div class="sylius-container">
        <form>
            
            <!-- Bloc Général classique -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Général</h2>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Code</label>
                        <input type="text" class="form-control" value="instruments_a_vent" readonly>
                    </div>
                </div>
            </div>

            <!-- Bloc Traductions classique -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Traductions (Français)</h2>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" value="Instruments à vent">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" rows="3">Flûtes Shakuhachi et créations sonores...</textarea>
                    </div>
                </div>
            </div>

            <!-- NOUVEAU BLOC : FOIRE AUX QUESTIONS -->
            <div class="card" id="faq-section">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h2 class="card-title">Foire Aux Questions</h2>
                </div>
                <div class="card-body bg-light">
                    
                    <p class="text-muted small mb-4">Ces questions apparaîtront à la fois sur la page de cette catégorie, et dans la FAQ globale de la boutique.</p>

                    <div id="faq-collection">
                        <!-- Les items FAQ apparaîtront ici -->
                    </div>

                    <button type="button" class="btn btn-outline-success" id="add-faq-btn">
                        + Ajouter une question
                    </button>

                </div>
            </div>

        </form>
    </div>

    <!-- Template pour un nouvel item FAQ (invisible) -->
    <template id="faq-item-template">
        <div class="faq-item-block">
            <button type="button" class="btn btn-sm btn-outline-danger remove-btn" onclick="this.closest('.faq-item-block').remove()">Supprimer</button>
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="m-0 fw-bold text-muted">Nouvelle Entrée FAQ</h6>
                <button type="button" class="btn-ai-generate" onclick="simulateAIGeneration(this)">
                    ✨ Générer par IA
                </button>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Question</label>
                <input type="text" class="form-control faq-input-question" placeholder="Ex: Comment entretenir mon instrument ?">
            </div>
            
            <div class="mb-3">
                <label class="form-label">Réponse</label>
                <textarea class="form-control faq-input-answer" rows="3" placeholder="Saisissez la réponse détaillée ici..."></textarea>
            </div>

            <div class="ai-loading">✨ L'IA rédige la question et la réponse relatives à "Instruments à vent"...</div>
        </div>
    </template>

    <script>
        // Ajouter une question
        document.getElementById('add-faq-btn').addEventListener('click', function() {
            const template = document.getElementById('faq-item-template');
            const clone = template.content.cloneNode(true);
            document.getElementById('faq-collection').appendChild(clone);
        });

        // Simuler la génération par IA
        function simulateAIGeneration(btnElement) {
            const block = btnElement.closest('.faq-item-block');
            const questionInput = block.querySelector('.faq-input-question');
            const answerInput = block.querySelector('.faq-input-answer');
            const loader = block.querySelector('.ai-loading');
            
            // État de chargement
            btnElement.style.display = 'none';
            loader.classList.add('active');
            questionInput.value = '';
            answerInput.value = '';
            questionInput.disabled = true;
            answerInput.disabled = true;

            // Simulation API Call
            setTimeout(() => {
                loader.classList.remove('active');
                questionInput.disabled = false;
                answerInput.disabled = false;
                
                // Remplissage magique
                questionInput.value = "Le bambou des instruments peut-il se fendre avec le temps ?";
                answerInput.value = "Nos instruments à vent sont façonnés à partir de chaumes de bambou matures ayant séché plusieurs années. Grâce à notre traitement spécifique, le risque de fissure est minime si vous évitez les chocs thermiques intenses et nourrissez la fibre mensuellement à l'huile de camélia.";
                
                // Style success
                block.style.borderLeftColor = '#6f42c1';
                block.style.backgroundColor = '#fdfbf7';
                
            }, 1500);
        }

        // Ajouter une question par défaut pour la maquette
        document.getElementById('add-faq-btn').click();
    </script>
</body>
</html>

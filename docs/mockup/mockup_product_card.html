<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquette - Carte Produit (Zen Too Craft)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darker: #050605;
            --bg-dark: #0A0C0B;
            --text-primary: #F4EFE6;
            --text-secondary: #A0A8A2;
            --gold-accent: #D4AF37;
        }

        body {
            margin: 0;
            padding: 4rem;
            background-color: var(--bg-darker);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
            max-width: 1200px;
            width: 100%;
        }

        /* La Carte Produit */
        .ztc-product-card {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            border-radius: 24px;
            padding: 1rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .ztc-product-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 4/5;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            background: #111;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .ztc-product-card:hover .image-wrapper img {
            transform: scale(1.05);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 400;
            color: #fff;
            margin: 0;
            letter-spacing: 0.02em;
        }

        .price {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--gold-accent);
        }

        .description {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 300;
            margin: 0 0 1.5rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Le Bouton CTA Glassmorphism pleine largeur */
        .actions-row {
            display: flex;
            width: 100%;
            margin-top: auto;
        }

        .cta-pill {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 9999px; /* Forme de pilule absolue */
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            /* Charte graphique : Or sur fond sombre */
            color: var(--gold-accent);
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }

        /* Micro-interaction au survol de la carte complète */
        .ztc-product-card:hover .cta-pill {
            background: var(--gold-accent);
            color: var(--bg-darker);
            border-color: var(--gold-accent);
        }

        .cta-pill svg {
            transition: transform 0.4s ease;
        }

        .ztc-product-card:hover .cta-pill svg {
            transform: translateX(4px);
        }

    </style>
</head>
<body>

    <div class="grid">
        <!-- Carte 1 -->
        <a href="#" class="ztc-product-card">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1599839575945-a9e5af0c3fa5?q=80&w=800&auto=format&fit=crop" alt="Flûte">
            </div>
            <div class="header-row">
                <h3 class="title">Jiari Shakuhachi</h3>
                <span class="price">450 €</span>
            </div>
            <p class="description">Une pièce maîtresse façonnée à la main à partir de bambou Madake vieilli. Vernis naturel traditionnel.</p>
            <div class="actions-row">
                <span class="cta-pill">
                    Découvrir 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </span>
            </div>
        </a>

        <!-- Carte 2 -->
        <a href="#" class="ztc-product-card">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1520529986992-d4ce365fbc99?q=80&w=800&auto=format&fit=crop" alt="Luminaire">
            </div>
            <div class="header-row">
                <h3 class="title">Lampe Kaguya</h3>
                <span class="price">280 €</span>
            </div>
            <p class="description">Luminaire d'ambiance avec structure en bambou tressé, diffusant une lumière douce et chaleureuse.</p>
            <div class="actions-row">
                <span class="cta-pill">
                    Découvrir 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </span>
            </div>
        </a>
    </div>

</body>
</html>

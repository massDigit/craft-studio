sylius_grid:
    grids:
        app_admin_blog_post:
            driver:
                name: doctrine/orm
                options:
                    class: App\Entity\Blog\BlogPost
            sorting:
                createdAt: desc
            fields:
                title:
                    type: string
                    label: Titre de l'article
                slug:
                    type: string
                    label: Slug (URL)
                published:
                    type: twig
                    label: Publie
                    options:
                        template: "@SyliusUi/Grid/Field/boolean.html.twig"
                createdAt:
                    type: datetime
                    label: Date de creation
                    options:
                        format: d/m/Y H:i
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete

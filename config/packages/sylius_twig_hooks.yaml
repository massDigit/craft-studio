                priority: 150
            translations:
                template: 'admin/product/form/side_navigation/translations_and_media.html.twig'
            channel_pricing:
                enabled: true
            taxes:
                enabled: false
            shipping:
                enabled: false
            inventory:
                enabled: false
            attributes:
                enabled: false
            associations:
                enabled: false

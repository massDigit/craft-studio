                enabled: false
            latest_statistics:
                enabled: false
            project_requests_dashboard:
                template: 'admin/dashboard/project_requests_wrapper.html.twig'
                priority: 100

        'sylius_cms.admin.page.create.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/create/content/header/title_block/title.html.twig'
                configuration:
                    header: 'sylius.ui.new_page'

        'sylius_cms.admin.page.update.content.header.title_block':
            title:
                template: '@SyliusAdmin/shared/crud/update/content/header/title_block/title.html.twig'
                configuration:
                    header: 'sylius.ui.edit_page'

        'sylius_admin.blog_post.create.content.header.title_block.actions':
            ai_assistant:
                template: 'admin/blog_post/header/ai_button.html.twig'
                priority: 50

        'sylius_admin.blog_post.create.content.form.sections':
            form:
                template: 'admin/blog_post/_form.html.twig'
                priority: 100
            general:
                enabled: false

        'sylius_admin.blog_post.update.content.header.title_block.actions':
